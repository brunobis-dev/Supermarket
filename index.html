<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#2E9E6D">
  <meta name="description" content="Lista de compras do mercado, offline-first, com histórico e catálogo de produtos.">

  <script>
    // Aplica o tema (salvo ou do sistema) antes do primeiro paint, pra não
    // piscar o tema errado por uma fração de segundo ao abrir a página.
    (function () {
      var salvo = localStorage.getItem('tema');
      var tema = (salvo === 'dark' || salvo === 'light')
        ? salvo
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-tema', tema);
    })();
  </script>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mercado">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">

  <title>Lista de Mercado</title>
</head>
<body>
  <button id="btn-alternar-tema" class="botao-icone botao-tema-flutuante" aria-label="Alternar modo escuro"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M484-80q-84 0-157.5-32t-128-86.5Q144-253 112-326.5T80-484q0-146 93-257.5T410-880q-18 99 11 193.5T521-521q71 71 165.5 100T880-410q-26 144-138 237T484-80Zm0-80q88 0 163-44t118-121q-86-8-163-43.5T464-465q-61-61-97-138t-43-163q-77 43-120.5 118.5T160-484q0 135 94.5 229.5T484-160Zm-20-305Z"/></svg></button>

  <main class="tela-inicio">
    <div class="inicio-conteudo">
      <svg class="inicio-ilustracao" viewBox="0 0 160 160" width="148" height="148" aria-hidden="true">
        <circle cx="80" cy="84" r="68" style="fill: var(--cor-acento-claro)"/>
        <path d="M50 78 Q80 20 110 78" fill="none" style="stroke: var(--cor-acento)" stroke-width="5" stroke-linecap="round"/>
        <path d="M44 78 L116 78 L102 124 L58 124 Z" style="fill: var(--cor-superficie); stroke: var(--cor-acento)" stroke-width="5" stroke-linejoin="round"/>
        <line x1="50" y1="94" x2="110" y2="94" style="stroke: var(--cor-acento)" stroke-width="3" opacity="0.45"/>
        <line x1="55" y1="110" x2="105" y2="110" style="stroke: var(--cor-acento)" stroke-width="3" opacity="0.45"/>
        <rect x="76" y="42" width="16" height="18" rx="3" style="fill: var(--cor-superficie); stroke: var(--cor-acento)" stroke-width="4"/>
        <circle cx="66" cy="60" r="11" style="fill: var(--cor-acento)"/>
        <circle cx="97" cy="56" r="8" style="fill: var(--cor-acento-escuro)"/>
      </svg>
      <h1 class="inicio-titulo">Lista de Mercado</h1>
      <p class="inicio-tagline">Sua lista, sempre à mão.</p>
      <a href="./lista.html" class="botao-primario botao-hero">Iniciar compra</a>
      <a href="./historico.html" class="link-secundario">Ver histórico de compras</a>
    </div>
  </main>

  <script src="./js/comum.js"></script>
  <script src="./js/inicio.js"></script>
</body>
</html>
