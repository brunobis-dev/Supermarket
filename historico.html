<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#2E9E6D">
  <meta name="description" content="Histórico de compras finalizadas.">

  <script>
    (function () {
      var salvo = localStorage.getItem('tema');
      var tema = (salvo === 'dark' || salvo === 'light')
        ? salvo
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-tema', tema);
    })();
  </script>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mercado">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">

  <title>Histórico — Lista de Mercado</title>
</head>
<body>
  <header class="app-header-voltar">
    <a href="./lista.html" class="botao-icone" aria-label="Voltar">←</a>
    <h1>Histórico de compras</h1>
  </header>

  <main class="sem-bottom-bar">
    <div id="lista-historico" class="lista-historico"></div>
  </main>

  <script src="./js/catalogo.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/comum.js"></script>
  <script src="./js/historico.js"></script>
</body>
</html>
